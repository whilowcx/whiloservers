# WhiloServers config
#
# Each key under "servers" is a server name that becomes a "/<name>" command connecting
# the player to it. "aliases" adds extra command names that do the same thing.
#
# permission: optional. Leave it empty ('') or omit it so everyone can use the command,
# or set a permission node to restrict it to staff (e.g. 'whiloservers.backrooms').
# Players without the permission won't be able to run the command at all.
servers:
  auth: {}
  lobby:
    aliases:
      - hub
  skyblock:
    aliases:
      - sb
